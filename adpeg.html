<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ads Page</title>

  <!-- Google AdSense -->

  <script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-xxxxxxxx"
  crossorigin="anonymous"></script>

  <style>

    body{
      margin:0;
      padding:30px;
      font-family:Arial;
      background:#ffffff;
      text-align:center;
    }

    h1{
      color:#333;
      margin-bottom:40px;
    }

    /* Ad Grid */

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:25px;
      max-width:1000px;
      margin:auto;
    }

    /* Ad Box */

    .ad{
      width:100%;
      aspect-ratio:1/1;
      border:2px solid #ccc;
      background:#f5f5f5;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    a{
      display:inline-block;
      margin-top:40px;
      padding:12px 25px;
      background:#333;
      color:white;
      text-decoration:none;
    }

  </style>

</head>
<body>

  <h1>My Google Ads</h1>

  <div class="grid">

    <!-- Ad 1 -->

    <div class="ad">

      <ins class="adsbygoogle"
           style="display:block;width:100%;height:100%;"
           data-ad-client="ca-pub-xxxxxxxx"
           data-ad-slot="111111111"></ins>

    </div>

    <!-- Ad 2 -->

    <div class="ad">

      <ins class="adsbygoogle"
           style="display:block;width:100%;height:100%;"
           data-ad-client="ca-pub-xxxxxxxx"
           data-ad-slot="222222222"></ins>

    </div>

    <!-- Ad 3 -->

    <div class="ad">

      <ins class="adsbygoogle"
           style="display:block;width:100%;height:100%;"
           data-ad-client="ca-pub-xxxxxxxx"
           data-ad-slot="333333333"></ins>

    </div>

    <!-- Ad 4 -->

    <div class="ad">

      <ins class="adsbygoogle"
           style="display:block;width:100%;height:100%;"
           data-ad-client="ca-pub-xxxxxxxx"
           data-ad-slot="444444444"></ins>

    </div>

  </div>

  <!-- Ads Script -->

  <script>

  </script>

  <a href="index.html">Back Home</a>

</body>
</html>
